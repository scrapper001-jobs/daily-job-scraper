name: Daily Job AI Scraper

on:
  schedule:
    - cron: '00 1 * * *'
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # cache తీసేయండి - requirements.txt లేనప్పుడు ఎర్రర్ వస్తుంది

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests tabulate duckduckgo-search

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium --with-deps
          echo "✅ Playwright chromium installed"

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.NVIDIA_NIM_API_KEY }}" ]; then
            echo "❌ NVIDIA_NIM_API_KEY secret is NOT set!"
            exit 1
          fi
          echo "✅ NVIDIA_NIM_API_KEY is set"

      - name: Run AI Job Scraper
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "🚀 Starting job scraper..."
          python scraper.py
          echo "✅ Scraper finished"

      - name: Upload CSV as Artifact (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-jobs-${{ github.run_number }}
          path: jobs_ai_agent_output.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Print Summary
        if: always()
        run: |
          if [ -f "jobs_ai_agent_output.csv" ]; then
            LINES=$(wc -l < jobs_ai_agent_output.csv)
            echo "📊 CSV has $((LINES - 1)) job records"
          else
            echo "⚠️ No CSV file generated"
          fi