name: Daily Job AI Scraper

on:
  schedule:
    - cron: '00 1 * * *'
  workflow_dispatch: 

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests tabulate duckduckgo-search
          # GitHub Actions లో sudo పర్మిషన్ ఉంటుంది కాబట్టి ఇది 100% పనిచేస్తుంది!
          npx playwright install --with-deps

      - name: Run AI Job Scraper
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scraper.py

      - name: Upload CSV as Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: daily-jobs-csv
          path: jobs_ai_agent_output.csv